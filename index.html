<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La flor y el río 🌸</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, serif;
            background: linear-gradient(
                to bottom,
                #dff5ff 0%,
                #b8e8d0 45%,
                #79b989 100%
            );
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene {
            position: relative;
            width: min(100vw, 900px);
            height: min(100vh, 650px);
            overflow: hidden;
        }

        /* Cielo */
        .sky {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, #fff8 0 5%, transparent 6%),
                radial-gradient(circle at 75% 15%, #fff7 0 4%, transparent 5%);
        }

        /* Suelo */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 42%;
            background: linear-gradient(#8bc57d, #5b965d);
            border-radius: 50% 50% 0 0;
        }

        /* Flor */
        .flower {
            position: absolute;
            left: 50%;
            bottom: 30%;
            transform: translateX(-50%);
            width: 120px;
            height: 190px;
            cursor: pointer;
            z-index: 10;
            transition: transform .5s ease;
        }

        .flower:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .stem {
            position: absolute;
            left: 57px;
            top: 70px;
            width: 8px;
            height: 120px;
            background: #43824a;
            border-radius: 10px;
        }

        .leaf {
            position: absolute;
            width: 55px;
            height: 25px;
            background: #4f9b55;
            border-radius: 100% 0 100% 0;
        }

        .leaf.left {
            left: 10px;
            top: 125px;
            transform: rotate(-25deg);
        }

        .leaf.right {
            right: 5px;
            top: 105px;
            transform: rotate(25deg) scaleX(-1);
        }

        .petals {
            position: absolute;
            left: 25px;
            top: 0;
            width: 80px;
            height: 80px;
        }

        .petal {
            position: absolute;
            width: 45px;
            height: 60px;
            background: #ff91b7;
            border-radius: 50% 50% 45% 45%;
            transform-origin: bottom center;
            box-shadow: inset 0 0 8px #ffffff80;
        }

        .petal:nth-child(1) {
            left: 18px;
            top: 0;
        }

        .petal:nth-child(2) {
            left: 0;
            top: 20px;
            transform: rotate(-60deg);
        }

        .petal:nth-child(3) {
            right: 0;
            top: 20px;
            transform: rotate(60deg);
        }

        .petal:nth-child(4) {
            left: 18px;
            top: 25px;
            transform: rotate(180deg);
        }

        .center {
            position: absolute;
            left: 32px;
            top: 28px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ffd45c;
            z-index: 3;
        }

        /* Texto inicial */
        .hint {
            position: absolute;
            top: 9%;
            left: 50%;
            transform: translateX(-50%);
            color: #315d46;
            font-size: 20px;
            text-align: center;
            z-index: 20;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        /* Raíces */
        .roots {
            position: absolute;
            left: 50%;
            bottom: 25%;
            transform: translateX(-50%);
            width: 190px;
            height: 100px;
            z-index: 4;
            opacity: 0;
            pointer-events: none;
        }

        .root {
            position: absolute;
            top: 0;
            left: 50%;
            width: 5px;
            height: 85px;
            background: #765334;
            border-radius: 10px;
            transform-origin: top;
        }

        .root:nth-child(1) {
            transform: rotate(-35deg);
        }

        .root:nth-child(2) {
            transform: rotate(-18deg);
        }

        .root:nth-child(3) {
            transform: rotate(0deg);
        }

        .root:nth-child(4) {
            transform: rotate(18deg);
        }

        .root:nth-child(5) {
            transform: rotate(35deg);
        }

        .root:nth-child(6) {
            height: 55px;
            transform: rotate(-55deg);
        }

        .root:nth-child(7) {
            height: 55px;
            transform: rotate(55deg);
        }

        .show-roots .roots {
            animation: rootsAppear 1.5s forwards;
        }

        @keyframes rootsAppear {
            from {
                opacity: 0;
                transform: translateX(-50%) scaleY(0);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) scaleY(1);
            }
        }

        /* Río */
        .river {
            position: absolute;
            bottom: -15%;
            left: -10%;
            width: 120%;
            height: 35%;
            background: linear-gradient(
                180deg,
                #7ee8ee,
                #3bb7d1,
                #2389b4
            );
            border-radius: 50% 50% 0 0;
            transform: translateY(100%);
            z-index: 12;
            box-shadow: 0 -10px 25px #ffffff55;
        }

        .river::before,
        .river::after {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: 25px;
            border-radius: 50%;
            background: #b9ffff88;
        }

        .river::before {
            top: 25px;
            animation: wave 2s infinite ease-in-out;
        }

        .river::after {
            top: 70px;
            animation: wave 2.5s infinite ease-in-out reverse;
        }

        @keyframes wave {
            0%, 100% {
                transform: translateX(-2%);
            }
            50% {
                transform: translateX(2%);
            }
        }

        .wave-start .river {
            animation: riverRise 2.5s cubic-bezier(.2,.7,.2,1) forwards;
        }

        @keyframes riverRise {
            0% {
                transform: translateY(100%);
            }
            65% {
                transform: translateY(-10%);
            }
            100% {
                transform: translateY(0);
            }
        }

        /* Gotas */
        .drop {
            position: absolute;
            width: 10px;
            height: 16px;
            border-radius: 50% 50% 50% 0;
            background: #b9f8ff;
            transform: rotate(-45deg);
            z-index: 15;
            opacity: 0;
        }

        .wave-start .drop {
            animation: splash 1s forwards;
        }

        .drop:nth-child(1) {
            left: 42%;
            bottom: 40%;
            animation-delay: .8s;
        }

        .drop:nth-child(2) {
            left: 52%;
            bottom: 42%;
            animation-delay: 1s;
        }

        .drop:nth-child(3) {
            left: 58%;
            bottom: 38%;
            animation-delay: 1.2s;
        }

        @keyframes splash {
            0% {
                opacity: 0;
                transform: translateY(20px) rotate(-45deg);
            }
            30% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) rotate(-45deg);
            }
        }

        /* Pantalla final */
        .final-message {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(0);
            background: #ffffff20;
        }

        .final-message p {
            font-size: clamp(30px, 7vw, 65px);
            color: #fff;
            text-shadow:
                0 3px 15px #1e5968,
                0 0 25px #ffffff80;
            transform: scale(.7);
        }

        .finished .final-message {
            animation: finalBlur 2s forwards;
        }

        @keyframes finalBlur {
            0% {
                opacity: 0;
                backdrop-filter: blur(0);
            }
            60% {
                opacity: 1;
                backdrop-filter: blur(2px);
            }
            100% {
                opacity: 1;
                backdrop-filter: blur(8px);
            }
        }

        .finished .final-message p {
            animation: messagePop 1.2s .5s forwards;
        }

        @keyframes messagePop {
            from {
                transform: scale(.7);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Botón reiniciar */
        .restart {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            border: none;
            padding: 12px 22px;
            border-radius: 30px;
            background: #ffffffcc;
            color: #315d46;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
        }

        .finished .restart {
            opacity: 1;
            pointer-events: auto;
        }

        .restart:hover {
            background: white;
            transform: translateX(-50%) scale(1.05);
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="scene" id="scene">

    <div class="sky"></div>
    <div class="ground"></div>

    <div class="hint" id="hint">
        Toca la flor 🌸
    </div>

    <!-- Flor -->
    <div class="flower" id="flower">

        <div class="petals">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>
    </div>

    <!-- Raíces -->
    <div class="roots">
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
    </div>

    <!-- Río -->
    <div class="river"></div>

    <!-- Gotas -->
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>

    <!-- Mensaje final -->
    <div class="final-message">
        <p>Así me tienes,<br>corriendo por ti 🌸💧</p>
    </div>

    <button class="restart" id="restart">
        Volver a empezar ↻
    </button>

</div>

<script>
    const scene = document.getElementById("scene");
    const flower = document.getElementById("flower");
    const hint = document.getElementById("hint");
    const restart = document.getElementById("restart");

    let activated = false;

    flower.addEventListener("click", () => {

        if (activated) return;

        activated = true;

        // Primera etapa: aparecen las raíces
        scene.classList.add("show-roots");
        hint.textContent = "Las raíces despiertan... 🌱";

        // Segunda etapa: aparece el río
        setTimeout(() => {
            scene.classList.add("wave-start");
            hint.textContent = "Y entonces llegó el río... 🌊";
        }, 1800);

        // Tercera etapa: desenfoque y mensaje
        setTimeout(() => {
            scene.classList.add("finished");
            hint.style.opacity = "0";
        }, 4300);
    });

    restart.addEventListener("click", () => {

        scene.classList.remove(
            "show-roots",
            "wave-start",
            "finished"
        );

        activated = false;

        hint.textContent = "Toca la flor 🌸";
        hint.style.opacity = "1";
    });
</script>

</body>
</html>
