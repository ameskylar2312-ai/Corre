<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flor 🌸</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(
        to bottom,
        #dff7ff,
        #c8edda 55%,
        #82b875
    );
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   ESCENARIO
========================= */

.sky {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 20%, #ffffffaa 0 4%, transparent 5%),
        radial-gradient(circle at 75% 15%, #ffffff88 0 3%, transparent 4%);
}

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 38%;
    background: linear-gradient(
        #8bc77a,
        #57965b
    );
    border-radius: 50% 50% 0 0;
}

/* =========================
   TEXTO "TOCA LA FLOR"
========================= */

.instruction {
    position: absolute;
    top: 9%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    color: #315b46;
    font-size: clamp(18px, 4vw, 25px);
    text-align: center;

    animation: floating 2s infinite ease-in-out;
    transition: opacity .6s;
}

@keyframes floating {
    0%,100% {
        transform: translate(-50%, 0);
    }

    50% {
        transform: translate(-50%, -7px);
    }
}

/* =========================
   FLOR
========================= */

.flower {
    position: absolute;
    left: 50%;
    bottom: 28%;

    width: 130px;
    height: 210px;

    transform: translateX(-50%);
    cursor: pointer;

    z-index: 10;

    transition: transform .5s;
}

.flower:hover {
    transform: translateX(-50%) scale(1.04);
}

.stem {
    position: absolute;

    left: 61px;
    top: 70px;

    width: 9px;
    height: 140px;

    background: #43834b;
    border-radius: 20px;
}

.leaf {
    position: absolute;

    width: 62px;
    height: 28px;

    background: #4d9a54;

    border-radius: 100% 0 100% 0;
}

.leaf.left {
    left: 4px;
    top: 135px;
    transform: rotate(-25deg);
}

.leaf.right {
    right: 0;
    top: 110px;
    transform: rotate(25deg) scaleX(-1);
}

.petals {
    position: absolute;

    left: 24px;
    top: 0;

    width: 85px;
    height: 85px;
}

.petal {
    position: absolute;

    width: 48px;
    height: 62px;

    background: #ff91b8;

    border-radius: 50%;

    box-shadow:
        inset 0 0 10px #ffffff77;
}

.petal:nth-child(1) {
    left: 18px;
    top: 0;
}

.petal:nth-child(2) {
    left: 0;
    top: 20px;
    transform: rotate(-60deg);
}

.petal:nth-child(3) {
    right: 0;
    top: 20px;
    transform: rotate(60deg);
}

.petal:nth-child(4) {
    left: 18px;
    top: 25px;
    transform: rotate(180deg);
}

.center {
    position: absolute;

    left: 32px;
    top: 29px;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: #ffd45b;

    z-index: 2;
}

/* =========================
   RAÍCES
========================= */

.roots {
    position: absolute;

    left: 50%;
    bottom: 22%;

    width: 230px;
    height: 130px;

    transform: translateX(-50%) scaleY(0);

    opacity: 0;

    z-index: 5;

    transform-origin: top;
}

.root {
    position: absolute;

    left: 50%;
    top: 0;

    width: 6px;
    height: 110px;

    background: #765333;

    border-radius: 20px;

    transform-origin: top;
}

.root:nth-child(1) {
    transform: rotate(-55deg);
}

.root:nth-child(2) {
    transform: rotate(-38deg);
}

.root:nth-child(3) {
    transform: rotate(-20deg);
}

.root:nth-child(4) {
    transform: rotate(0deg);
}

.root:nth-child(5) {
    transform: rotate(20deg);
}

.root:nth-child(6) {
    transform: rotate(38deg);
}

.root:nth-child(7) {
    transform: rotate(55deg);
}

/* Aparecen al tocar */

.roots-visible .roots {
    animation: rootsGrow 1.2s ease-out forwards;
}

@keyframes rootsGrow {
    0% {
        opacity: 0;
        transform: translateX(-50%) scaleY(0);
    }

    100% {
        opacity: 1;
        transform: translateX(-50%) scaleY(1);
    }
}

/* =========================
   GOTITAS
========================= */

.drop {
    position: absolute;

    width: 12px;
    height: 20px;

    background: #9eeeff;

    border-radius: 50% 50% 50% 0;

    transform: rotate(-45deg);

    opacity: 0;

    z-index: 20;
}

/* Las gotas aparecen de repente */

.drops-visible .drop {
    animation: fallingDrop .9s ease-in forwards;
}

.drop:nth-child(1) {
    left: 43%;
    top: 5%;
}

.drop:nth-child(2) {
    left: 52%;
    top: 12%;
    animation-delay: .25s;
}

.drop:nth-child(3) {
    left: 59%;
    top: 4%;
    animation-delay: .45s;
}

.drop:nth-child(4) {
    left: 48%;
    top: 20%;
    animation-delay: .6s;
}

@keyframes fallingDrop {

    0% {
        opacity: 0;
        transform: translateY(-30px) rotate(-45deg);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform: translateY(400px) rotate(-45deg);
    }
}

/* =========================
   OLA GIGANTE
========================= */

.wave {
    position: absolute;

    left: -10%;
    bottom: -45%;

    width: 120%;
    height: 65%;

    background:
        linear-gradient(
            to bottom,
            #a6f7ff,
            #52cde2 35%,
            #238caf
        );

    border-radius: 50% 50% 0 0;

    z-index: 25;

    transform: translateY(100%);

    box-shadow:
        0 -15px 30px #ffffff99;
}

/* espuma */

.wave::before {
    content: "";

    position: absolute;

    top: 15px;
    left: 0;

    width: 100%;
    height: 35px;

    background: #d9ffffaa;

    border-radius: 50%;

    animation: waveMove 1.5s infinite ease-in-out;
}

.wave::after {
    content: "";

    position: absolute;

    top: 65px;
    left: 5%;

    width: 90%;
    height: 25px;

    background: #ffffff55;

    border-radius: 50%;
}

@keyframes waveMove {

    0%,100% {
        transform: translateX(-3%);
    }

    50% {
        transform: translateX(3%);
    }
}

.wave-visible .wave {
    animation: giantWave 2.2s cubic-bezier(.2,.75,.25,1) forwards;
}

@keyframes giantWave {

    0% {
        transform: translateY(100%);
    }

    65% {
        transform: translateY(-5%);
    }

    100% {
        transform: translateY(0);
    }
}

/* =========================
   DESENFOQUE FINAL
========================= */

.blur-screen {
    position: absolute;

    inset: 0;

    z-index: 40;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 30px;

    background: #ffffff15;

    backdrop-filter: blur(0px);

    opacity: 0;

    pointer-events: none;
}

.blur-screen p {
    color: white;

    font-size: clamp(32px, 8vw, 75px);

    line-height: 1.15;

    text-shadow:
        0 4px 18px #216477;

    transform: scale(.7);

    opacity: 0;
}

/* Activación final */

.final .blur-screen {
    animation: blurIn 2s ease forwards;
}

@keyframes blurIn {

    0% {
        opacity: 0;
        backdrop-filter: blur(0px);
    }

    100% {
        opacity: 1;
        backdrop-filter: blur(9px);
    }
}

.final .blur-screen p {
    animation: textAppear 1.3s .5s ease forwards;
}

@keyframes textAppear {

    0% {
        opacity: 0;
        transform: scale(.7);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================
   REINICIAR
========================= */

.restart {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    border: none;

    padding: 12px 22px;

    border-radius: 30px;

    background: #ffffffdd;

    color: #315b46;

    font-family: Georgia, serif;

    cursor: pointer;

    opacity: 0;
    pointer-events: none;

    transition: .3s;
}

.final .restart {
    opacity: 1;
    pointer-events: auto;
}

.restart:hover {
    transform: translateX(-50%) scale(1.05);
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="sky"></div>
    <div class="ground"></div>

    <!-- TEXTO INICIAL -->
    <div class="instruction" id="instruction">
        Toca la flor 🌸
    </div>

    <!-- FLOR -->
    <div class="flower" id="flower">

        <div class="petals">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>

        </div>

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

    </div>

    <!-- RAÍCES -->
    <div class="roots">

        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>
        <div class="root"></div>

    </div>

    <!-- GOTAS -->
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>

    <!-- OLA -->
    <div class="wave"></div>

    <!-- FINAL -->
    <div class="blur-screen">

        <p>
            Así me tienes,<br>
            corriendome 
        </p>

    </div>

    <!-- REINICIAR -->
    <button class="restart" id="restart">
        Volver a empezar ↻
    </button>

</div>


<script>

const scene = document.getElementById("scene");
const flower = document.getElementById("flower");
const instruction = document.getElementById("instruction");
const restart = document.getElementById("restart");

let started = false;


/*
    SECUENCIA:

    1. Tocas la flor.
    2. Aparecen las raíces.
    3. Caen las gotas.
    4. Llega la ola gigante.
    5. Todo se vuelve borroso.
*/

flower.addEventListener("click", () => {

    if (started) return;

    started = true;

    instruction.style.opacity = "0";

    /* 1 — RAÍCES */

    scene.classList.add("roots-visible");


    /* 2 — GOTITAS */

    setTimeout(() => {

        scene.classList.add("drops-visible");

    }, 1300);


    /* 3 — OLA */

    setTimeout(() => {

        scene.classList.add("wave-visible");

    }, 2300);


    /* 4 — FINAL */

    setTimeout(() => {

        scene.classList.add("final");

    }, 4400);

});


/* REINICIAR */

restart.addEventListener("click", () => {

    scene.classList.remove(
        "roots-visible",
        "drops-visible",
        "wave-visible",
        "final"
    );

    started = false;

    instruction.style.opacity = "1";

});

</script>

</body>
</html>
