<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tormenta 🌧️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, serif;
}

/* ESCENA */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #dff7fa 0%,
            #ccebdc 55%,
            #83b875 100%
        );

    transition: background 2s ease;
}


/* CIELO */

.sky {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.45),
            transparent 35%
        );

    transition: opacity 2s ease;
}

.storm .sky {

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(150,170,190,.22),
            transparent 30%
        ),
        linear-gradient(
            to bottom,
            #273442,
            #394856 45%,
            #51616a
        );
}


/* TIERRA */

.ground {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 38%;

    background:
        linear-gradient(
            to bottom,
            #91c979,
            #568f58
        );

    border-radius: 50% 50% 0 0;

    transition:
        filter 2s ease;
}

.storm .ground {
    filter:
        brightness(.65)
        saturate(.8);
}


/* TEXTO */

.instruction {

    position: absolute;

    top: 9%;
    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    color: #315b46;

    font-size:
        clamp(18px, 4vw, 25px);

    transition:
        opacity .7s,
        color 1.5s;
}

.storm .instruction {
    color: #dce8ed;
}


/* FLOR */

.flower {

    position: absolute;

    left: 50%;
    bottom: 28%;

    width: 130px;
    height: 210px;

    transform: translateX(-50%);

    z-index: 20;

    cursor: pointer;

    transition:
        filter 1s ease;
}


/* TALLO */

.stem {

    position: absolute;

    left: 50%;
    bottom: 0;

    width: 8px;
    height: 145px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            to right,
            #386e45,
            #6eaa68,
            #386e45
        );

    border-radius: 20px;
}


/* HOJAS */

.leaf {

    position: absolute;

    width: 62px;
    height: 28px;

    background: #4d9557;

    border-radius:
        100% 0 100% 0;
}

.leaf.left {

    left: 5px;
    bottom: 55px;

    transform: rotate(-25deg);
}

.leaf.right {

    right: 5px;
    bottom: 85px;

    transform:
        scaleX(-1)
        rotate(-25deg);
}


/* PÉTALOS */

.petals {

    position: absolute;

    left: 50%;
    top: 0;

    width: 105px;
    height: 105px;

    transform:
        translateX(-50%);
}

.petal {

    position: absolute;

    width: 55px;
    height: 70px;

    background:
        linear-gradient(
            to bottom,
            #ffd8e5,
            #ef91b1
        );

    border-radius: 50%;

    transition:
        filter 1s ease;
}

.petal:nth-child(1) {
    left: 25px;
    top: 0;
}

.petal:nth-child(2) {
    left: 0;
    top: 25px;

    transform: rotate(-70deg);
}

.petal:nth-child(3) {

    right: 0;
    top: 25px;

    transform: rotate(70deg);
}

.petal:nth-child(4) {

    left: 25px;
    bottom: -5px;

    transform: rotate(180deg);
}


/* CENTRO */

.center {

    position: absolute;

    left: 50%;
    top: 42px;

    width: 35px;
    height: 35px;

    transform:
        translateX(-50%);

    background: #e5ad42;

    border-radius: 50%;
}


/* ⚡ RAYO */

.lightning {

    position: absolute;

    top: -10%;
    left: 50%;

    width: 120px;
    height: 125%;

    z-index: 60;

    opacity: 0;

    transform:
        translateX(-50%);

    /*
       Ahora sí tiene forma de rayo:
       zigzag grande y marcado.
    */

    clip-path: polygon(
        48% 0%,
        70% 0%,
        58% 27%,
        78% 27%,
        38% 58%,
        51% 58%,
        22% 100%,
        34% 62%,
        20% 62%,
        43% 32%,
        25% 32%
    );

    background: white;

    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 20px #bcefff)
        drop-shadow(0 0 45px #8eeaff);
}


/* FLASH */

.light-flash {

    position: absolute;

    inset: 0;

    z-index: 55;

    background: white;

    opacity: 0;

    pointer-events: none;
}


/* ANIMACIÓN DEL RAYO */

.lightning-strike .lightning {

    animation:
        lightning .8s ease-out forwards;
}

.lightning-strike .light-flash {

    animation:
        flash .8s ease-out forwards;
}


@keyframes lightning {

    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(-30px)
            scaleY(.8);
    }

    12% {
        opacity: 1;
    }

    20% {
        opacity: .15;
    }

    28% {
        opacity: 1;
    }

    45% {
        opacity: .2;
    }

    55% {
        opacity: 1;
    }

    70% {
        opacity: 0;
    }

    100% {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(0)
            scaleY(1);
    }
}


@keyframes flash {

    0% {
        opacity: 0;
    }

    12% {
        opacity: .65;
    }

    25% {
        opacity: .08;
    }

    35% {
        opacity: .45;
    }

    50% {
        opacity: 0;
    }
}


/* GOTAS */

.drop {

    position: absolute;

    top: -30px;

    width: 9px;
    height: 17px;

    background:
        linear-gradient(
            135deg,
            #e9fcff,
            #61d3e7
        );

    border-radius:
        60% 40% 60% 40%;

    transform:
        rotate(-45deg);

    opacity: 0;

    z-index: 40;
}

.drop:nth-of-type(1) {
    left: 37%;
}

.drop:nth-of-type(2) {
    left: 47%;
}

.drop:nth-of-type(3) {
    left: 56%;
}

.drop:nth-of-type(4) {
    left: 64%;
}


.drops-visible .drop {

    animation:
        naturalDrop
        1.2s
        ease-in
        forwards;
}


.drop:nth-of-type(2) {
    animation-delay: .15s;
}

.drop:nth-of-type(3) {
    animation-delay: .3s;
}

.drop:nth-of-type(4) {
    animation-delay: .45s;
}


@keyframes naturalDrop {

    0% {
        opacity: 0;

        transform:
            translateY(-30px)
            rotate(-45deg)
            scale(.7);
    }

    20% {
        opacity: .9;
    }

    100% {
        opacity: 0;

        transform:
            translateY(350px)
            rotate(-45deg)
            scale(1);
    }
}


/* LLUVIA */

.rain {

    position: absolute;

    inset: -20%;

    z-index: 35;

    opacity: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            105deg,
            transparent 0 17px,
            rgba(220,249,255,.42) 18px,
            rgba(220,249,255,.42) 20px,
            transparent 21px 38px
        );
}


.rain-active .rain {

    animation:
        heavyRain
        2s
        ease-in
        forwards;
}


@keyframes heavyRain {

    0% {
        opacity: 0;

        transform:
            translateY(-20%);
    }

    30% {
        opacity: .35;
    }

    100% {
        opacity: .75;

        transform:
            translateY(20%);
    }
}


/* AGUA */

.water {

    position: absolute;

    left: -5%;
    bottom: -110%;

    width: 110%;
    height: 120%;

    z-index: 45;

    opacity: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(154,235,243,.82),
            rgba(69,186,210,.94) 30%,
            rgba(35,135,165,.98) 70%,
            #155f7d 100%
        );

    border-radius:
        48% 52% 0 0 /
        7% 7% 0 0;

    box-shadow:
        0 -12px 35px
        rgba(255,255,255,.65);
}


.water::before {

    content: "";

    position: absolute;

    top: -20px;
    left: 0;

    width: 100%;
    height: 40px;

    background:

        radial-gradient(
            ellipse at 15% 70%,
            rgba(255,255,255,.7) 0 3%,
            transparent 4%
        ),

        radial-gradient(
            ellipse at 35% 30%,
            rgba(255,255,255,.6) 0 4%,
            transparent 5%
        ),

        radial-gradient(
            ellipse at 55% 75%,
            rgba(255,255,255,.7) 0 3%,
            transparent 4%
        ),

        radial-gradient(
            ellipse at 76% 40%,
            rgba(255,255,255,.65) 0 4%,
            transparent 5%
        );
}


.water::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            170deg,
            transparent 0 55px,
            rgba(255,255,255,.07) 57px,
            transparent 60px 100px
        );
}


.flood-active .water {

    animation:
        flood
        3.5s
        cubic-bezier(.2,.7,.2,1)
        forwards;
}


@keyframes flood {

    0% {
        bottom: -110%;
        opacity: 0;
    }

    12% {
        opacity: .3;
    }

    35% {
        bottom: -70%;
        opacity: .6;
    }

    60% {
        bottom: -35%;
        opacity: .82;
    }

    82% {
        bottom: -12%;
        opacity: .93;
    }

    100% {
        bottom: -2%;
        opacity: .96;
    }
}


/* FLOR BAJO EL AGUA */

.underwater .flower {

    animation:
        underwaterFlower
        2.8s
        ease-in-out
        forwards;

    filter:
        saturate(.75)
        brightness(.85);
}


@keyframes underwaterFlower {

    0% {
        transform:
            translateX(-50%)
            rotate(0deg);
    }

    25% {
        transform:
            translateX(-50%)
            rotate(-3deg);
    }

    50% {
        transform:
            translateX(-50%)
            rotate(3deg);
    }

    75% {
        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(2deg);
    }
}


/* BURBUJAS */

.bubbles {

    position: absolute;

    inset: 0;

    z-index: 50;

    pointer-events: none;

    opacity: 0;
}


.bubble {

    position: absolute;

    bottom: -30px;

    width: 10px;
    height: 10px;

    border:
        2px solid
        rgba(255,255,255,.65);

    border-radius: 50%;
}


.bubble:nth-child(1) {
    left: 25%;
}

.bubble:nth-child(2) {
    left: 39%;

    width: 7px;
    height: 7px;
}

.bubble:nth-child(3) {
    left: 55%;

    width: 14px;
    height: 14px;
}

.bubble:nth-child(4) {
    left: 70%;

    width: 8px;
    height: 8px;
}

.bubble:nth-child(5) {
    left: 82%;

    width: 13px;
    height: 13px;
}


.bubbles-active .bubbles {
    opacity: 1;
}


.bubbles-active .bubble {

    animation:
        bubbleUp
        4s
        ease-in
        infinite;
}


.bubble:nth-child(2) {
    animation-delay: .8s;
}

.bubble:nth-child(3) {
    animation-delay: 1.4s;
}

.bubble:nth-child(4) {
    animation-delay: .5s;
}

.bubble:nth-child(5) {
    animation-delay: 2s;
}


@keyframes bubbleUp {

    0% {

        transform:
            translateY(0)
            translateX(0);

        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {

        transform:
            translateY(-110vh)
            translateX(20px);

        opacity: 0;
    }
}


/* RAYOS DE LUZ BAJO EL AGUA */

.light-rays {

    position: absolute;

    inset: 0;

    z-index: 47;

    pointer-events: none;

    opacity: 0;

    background:

        linear-gradient(
            112deg,
            transparent 25%,
            rgba(255,255,255,.12) 28%,
            transparent 34%
        ),

        linear-gradient(
            70deg,
            transparent 55%,
            rgba(255,255,255,.1) 59%,
            transparent 66%
        );
}


.underwater .light-rays {

    animation:
        underwaterLight
        3s
        ease
        forwards;
}


@keyframes underwaterLight {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* DESENFOQUE FINAL */

.blur-screen {

    position: absolute;

    inset: 0;

    z-index: 70;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;

    background:
        rgba(40,140,165,.2);

    backdrop-filter:
        blur(0);

    opacity: 0;

    pointer-events: none;
}


.blur-screen p {

    color: white;

    font-size:
        clamp(30px, 8vw, 70px);

    line-height: 1.15;

    text-shadow:
        0 4px 20px
        rgba(10,80,105,.9);

    transform:
        scale(.75);

    opacity: 0;
}


.final .blur-screen {

    animation:
        finalBlur
        2s
        ease
        forwards;
}


.final .blur-screen p {

    animation:
        finalText
        1.2s
        .5s
        ease
        forwards;
}


@keyframes finalBlur {

    from {
        opacity: 0;
        backdrop-filter:
            blur(0);
    }

    to {
        opacity: 1;
        backdrop-filter:
            blur(12px);
    }
}


@keyframes finalText {

    from {
        opacity: 0;
        transform:
            scale(.75);
    }

    to {
        opacity: 1;
        transform:
            scale(1);
    }
}


/* BOTÓN */

.restart {

    position: absolute;

    bottom: 5%;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 90;

    padding:
        10px 20px;

    border: none;

    border-radius: 20px;

    background:
        rgba(255,255,255,.85);

    color: #315b46;

    font-family:
        Georgia, serif;

    opacity: 0;

    pointer-events: none;
}


.final .restart {

    opacity: 1;

    pointer-events: auto;
}

</style>
</head>


<body>

<div class="scene" id="scene">

    <div class="sky"></div>

    <div class="ground"></div>


    <div class="instruction" id="instruction">
        Toca la flor
    </div>


    <!-- FLOR -->

    <div class="flower" id="flower">

        <div class="petals">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>

        </div>

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

    </div>


    <!-- GOTAS -->

    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>


    <!-- RAYO -->

    <div class="lightning"></div>

    <div class="light-flash"></div>


    <!-- LLUVIA -->

    <div class="rain"></div>


    <!-- AGUA -->

    <div class="water"></div>


    <!-- BURBUJAS -->

    <div class="bubbles">

        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>

    </div>


    <!-- RAYOS DE LUZ -->

    <div class="light-rays"></div>


    <!-- FINAL -->

    <div class="blur-screen">

        <p>
            Así me tienes,<br>
            corriendome
        </p>

    </div>


    <button class="restart" id="restart">
        Volver a empezar
    </button>

</div>


<script>

const scene =
    document.getElementById("scene");

const flower =
    document.getElementById("flower");

const instruction =
    document.getElementById("instruction");

const restart =
    document.getElementById("restart");


let started = false;


/* AL TOCAR LA FLOR */

flower.addEventListener("click", () => {

    if (started) return;

    started = true;

    instruction.style.opacity = "0";


    /* 1. SE OSCURECE EL CIELO */

    scene.classList.add("storm");


    /* 2. CAE EL RAYO */

    setTimeout(() => {

        scene.classList.add(
            "lightning-strike"
        );

    }, 250);


    /* 3. PRIMERAS GOTAS */

    setTimeout(() => {

        scene.classList.add(
            "drops-visible"
        );

    }, 1000);


    /* 4. LLUVIA FUERTE */

    setTimeout(() => {

        scene.classList.add(
            "rain-active"
        );

    }, 1900);


    /* 5. COMIENZA LA INUNDACIÓN */

    setTimeout(() => {

        scene.classList.add(
            "flood-active"
        );

    }, 2400);


    /* 6. LA FLOR QUEDA BAJO EL AGUA */

    setTimeout(() => {

        scene.classList.add(
            "underwater"
        );

    }, 4000);


    /* 7. APARECEN BURBUJAS */

    setTimeout(() => {

        scene.classList.add(
            "bubbles-active"
        );

    }, 4300);


    /* 8. TODO SE DESENFOCA */

    setTimeout(() => {

        scene.classList.add(
            "final"
        );

    }, 6100);

});


/* REINICIAR */

restart.addEventListener("click", () => {

    scene.classList.remove(

        "storm",
        "lightning-strike",
        "drops-visible",
        "rain-active",
        "flood-active",
        "underwater",
        "bubbles-active",
        "final"

    );

    started = false;

    instruction.style.opacity = "1";

});

</script>

</body>
</html>
